# Package metadata for the other-distribution packages (.rpm, Arch, AppImage,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh and packaging/arch/aur.sh. Keep it in step with
# packaging/linux/build-deb.sh.

NAME=rover-explorer
APP_NAME=Rover-Explorer
GITHUB_REPO=Dhiva-Labs/rover_explorer
TAG_PREFIX=v
SUMMARY='Windows XP-style file explorer with a search companion dog'
DESCRIPTION='Rover Explorer is a file manager for Linux styled after the Windows XP Luna interface. It ships an animated search-companion dog and an Everything-style indexed filename search that returns ranked results on every keystroke across hundreds of thousands of files.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/rover_explorer
LICENSE=MIT
LICENSE_FILE=LICENSE

# lib/libdartjni.so comes from the jni plugin (pulled in by the Android
# plugins). CMake found the runner's JDK, so it links libjvm.so with a RUNPATH
# into that JDK; no distribution resolves it, and the desktop app never loads
# it (the snap, built without a JDK, has none and works). No new format ships
# it.
EXCLUDE=(opt/rover-explorer/lib/libdartjni.so)
PACKAGE_EXCLUDE=()

# rpm: shared-library dependencies are worked out from the ELF files. The app
# opens files with xdg-open and plays its bark through pw-play/paplay/aplay
# when one is there; like the .deb, the package does not require them.
RPM_REQUIRES=()
ARCH_DEPENDS=(gtk3)
ARCH_INDEPENDENT=0

APPIMAGE=1
EXEC=opt/rover-explorer/rover_explorer
DESKTOP=usr/share/applications/rover-explorer.desktop
ICON=usr/share/icons/hicolor/256x256/apps/rover-explorer.png
APPRUN_ENV=''

# Smoke test in each distribution container: the repository's own, which
# waits for the "Rover Explorer" window (Flutter drew its first frame) and
# for the indexer isolate to have written a marker file from $HOME into its
# index (the Dart file-system code ran).
GUI_CMD=rover-explorer
SMOKE_SCRIPT=packaging/ci/smoke-linux.sh
SMOKE_SECONDS=90
SMOKE_CMD=''
