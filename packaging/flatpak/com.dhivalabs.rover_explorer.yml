# Flatpak manifest for Rover Explorer.
#
# Like the .rpm, Arch package and AppImage, this repackages the installed
# tree of the .deb that CI builds (unpacked into packaging/flatpak/tree/ by
# the workflow), so the Flatpak ships the same binary as every other format
# instead of a second build inside the sandbox. A Flathub submission needs
# `tree` swapped for an archive source (release URL + sha256); see README.md
# in this directory.
id: com.dhivalabs.rover_explorer
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: rover-explorer
finish-args:
  # GTK needs a display socket; fallback-x11 covers X11-only desktops.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU acceleration for Flutter's renderer.
  - --device=dri
  # A file manager: it browses and indexes the whole file system (/, home,
  # /media, /mnt) by path, which no portal covers.
  - --filesystem=host
  # The companion's bark (pw-play or paplay, when the runtime has one).
  - --socket=pulseaudio
modules:
  - name: rover-explorer
    buildsystem: simple
    build-options:
      # Stripping the Flutter AOT snapshot (libapp.so) leaves an app that
      # cannot start.
      no-debuginfo: true
      strip: false
    sources:
      - type: dir
        path: tree
        dest: tree
      - type: file
        path: com.dhivalabs.rover_explorer.metainfo.xml
    build-commands:
      # Flutter finds lib/ and data/ next to its executable. Files open
      # through the runtime's xdg-open, which hands them to the OpenURI portal.
      - install -d /app/lib && cp -a tree/opt/rover-explorer /app/lib/rover-explorer
      - install -d /app/bin && ln -s ../lib/rover-explorer/rover_explorer /app/bin/rover-explorer
      - install -Dm644 tree/usr/share/applications/rover-explorer.desktop /app/share/applications/com.dhivalabs.rover_explorer.desktop
      - desktop-file-edit --set-icon=com.dhivalabs.rover_explorer --set-key=Exec --set-value='rover-explorer %U' /app/share/applications/com.dhivalabs.rover_explorer.desktop
      - install -Dm644 tree/usr/share/icons/hicolor/256x256/apps/rover-explorer.png /app/share/icons/hicolor/256x256/apps/com.dhivalabs.rover_explorer.png
      - install -Dm644 tree/usr/share/licenses/rover-explorer/LICENSE /app/share/licenses/com.dhivalabs.rover_explorer/LICENSE
      - install -Dm644 com.dhivalabs.rover_explorer.metainfo.xml /app/share/metainfo/com.dhivalabs.rover_explorer.metainfo.xml
